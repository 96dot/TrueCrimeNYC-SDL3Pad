; TCNYCSDL3Pad - SDL3 controller support for True Crime: New York City
;
; The plugin hides your real controller from the game's old DirectInput code and gives the game a
; virtual Xbox-style controller instead, read through SDL3 (Xbox, PlayStation, Switch and most others).
;
; Button names you can use below:
;   A B X Y  (or CROSS CIRCLE SQUARE TRIANGLE)
;   LB RB LT RT  (or L1 R1 L2 R2)        LS RS  (stick clicks, or L3 R3)
;   BACK START GUIDE  (or CREATE/SHARE OPTIONS PS)
;   DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT   TOUCHPAD   MISC (mute/capture button)
;   PADDLE1 PADDLE2 PADDLE3 PADDLE4
;   leave empty (or NONE) for no button
; The sticks and the d-pad always do what the game expects (move, aim, weapon/menu selection).

[Settings]
; 0 = turn the plugin off completely
Enabled=1
; 1 = turn the game's force feedback into controller rumble
Rumble=1
; rumble strength in percent (0-200)
RumbleStrength=100
; stick dead zone in percent. The game itself asks for 25%, which feels sluggish on modern pads
StickDeadzone=15
; how far a trigger has to be pulled (percent) to count as pressed
TriggerThreshold=30
; 1 = push up to aim down while on foot and in vehicles (menus are not affected)
InvertAimY=0
; 1 = move with the right stick and aim with the left (menus are not affected)
SwapSticks=0
; 1 = keep reading the controller while the game is not the active window
InputInBackground=0
; on-screen hints ("Press ... to Save Game"): 0 = keyboard keys as before,
; 1 = controller buttons while a controller is connected, 2 = always controller buttons
ButtonPrompts=1
; button names in hints: auto (PlayStation names for PlayStation pads), xbox, playstation
ButtonNames=auto
; 1 = write every controller event to TCNYCSDL3Pad.log (for troubleshooting only)
LogInput=0

; The defaults follow the original Xbox layout the game was designed for
; (the Xbox's Black and White buttons became LB and RB).

[OnFoot]
LightAttack=A
Grapple=B
HeavyAttack=X
Jump=Y
UseAction=LB
ReloadBlock=RB
BadgeWarningShot=BACK
PauseMap=START
Crouch=LS
PrecisionAim=RS
TargetLock=LT
FireWeapon=RT
; keyboard-only actions in the PC version, free to put on a spare button:
Stealth=
PrevCombatMode=
NextCombatMode=
Next2ndWeapon=
NextMainWeapon=

[Driving]
Accelerate=A
Handbrake=B
BrakeReverse=X
LookBehind=Y
CarDoor=LB
Reload=RB
SirenHorn=BACK
PauseMap=START
LeftStickClick=LS
PrecisionAim=RS
TargetLock=LT
FireWeapon=RT
; keyboard-only actions in the PC version (Endo/Wheelie are motorbike tricks):
Endo=
Wheelie=
PrevCameraMode=
NextCameraMode=
RestartSong=
NextSong=

[Menus]
Select=A
; the game's own B button (back out / clear waypoint on the map)
ButtonB=B
SetWaypoint=X
ButtonY=Y
Back=BACK
Exit=START
LeftTrigger=LT
RightTrigger=RT
